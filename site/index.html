<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spite Store</title>
    <style>
      body {
        font:
          15px system-ui,
          sans-serif;
        max-width: 960px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        color: #666;
        margin: 0 0 20px;
      }
      #error {
        color: #b00020;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Spite Store</h1>
    <p>
      Every seed is a different performance, and the same seed is the same performance anywhere.
    </p>
    <p id="error" role="alert" hidden></p>
    <!-- piece, version, seed and bars come from the page URL (?piece=…&version=…&seed=…&bars=…);
         src/main.ts sets src once the version is resolved and verified -->
    <spite-player stems="/stems/"></spite-player>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
